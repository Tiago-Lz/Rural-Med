# Porta do servidor: http://localhost:8080
server.port=8080

# Conexão com o PostgreSQL.
# "stringtype=unspecified" deixa o PostgreSQL converter texto para os tipos ENUM e JSONB do banco.
spring.datasource.url=jdbc:postgresql://localhost:5432/ruralmed?stringtype=unspecified
spring.datasource.username=ruralmed
spring.datasource.password=ruralmed

# Quem cria as tabelas é o Flyway (pasta db/migration), não o Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Mostra no console o SQL que o Hibernate executa (útil para a apresentação).
spring.jpa.show-sql=false

spring.jackson.serialization.fail-on-empty-beans=false

# Datas na URL no formato 2026-11-03
spring.mvc.format.date=iso
